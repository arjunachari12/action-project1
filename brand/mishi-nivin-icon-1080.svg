<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="mn_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8FB3"/>
      <stop offset="50%" stop-color="#FF7AB6"/>
      <stop offset="100%" stop-color="#7EB6FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background circle for avatar safety -->
  <circle cx="540" cy="540" r="520" fill="url(#mn_grad)"/>

  <!-- MN monogram -->
  <g stroke="#FFFFFF" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)">
    <!-- M -->
    <path d="M320 760 L320 320 L440 560 L540 320 L540 760"/>
    <!-- N -->
    <path d="M620 760 L620 320 M620 320 L780 760 M780 760 L780 320"/>
