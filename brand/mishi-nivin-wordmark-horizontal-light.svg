    <text x="0" y="140" font-family="'Poppins', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="28" fill="#6B7280" letter-spacing="2">KIDSWEAR • WOMENSWEAR</text>
